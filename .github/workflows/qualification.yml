name: Qualified IOMAD matrix
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - iomad: '4.5.15'
            commit: 3e7d23c1b60018f8f540c1fbf929e1baa6755b7f
            php: '8.1'
            database: mysqli
            mysql: '8.0'
          - iomad: '4.5.15'
            commit: 3e7d23c1b60018f8f540c1fbf929e1baa6755b7f
            php: '8.3'
            database: mysqli
            mysql: '8.0'
          - iomad: '4.5.15'
            commit: 3e7d23c1b60018f8f540c1fbf929e1baa6755b7f
            php: '8.3'
            database: pgsql
            mysql: '8.0'
          - iomad: '5.0.11'
            commit: addcdf8f4647b853fd85b6817571d5529caf6cfd
            php: '8.2'
            database: mysqli
            mysql: '8.4'
          - iomad: '5.0.11'
            commit: addcdf8f4647b853fd85b6817571d5529caf6cfd
            php: '8.3'
            database: mysqli
            mysql: '8.4'
          - iomad: '5.0.11'
            commit: addcdf8f4647b853fd85b6817571d5529caf6cfd
            php: '8.3'
            database: pgsql
            mysql: '8.4'
          - iomad: '5.0.11'
            commit: addcdf8f4647b853fd85b6817571d5529caf6cfd
            php: '8.4'
            database: pgsql
            mysql: '8.4'
          - iomad: '5.1.8'
            commit: 7738c4391469132ec54b9ea7505fd29922c2b015
            php: '8.2'
            database: mysqli
            mysql: '8.4'
          - iomad: '5.1.8'
            commit: 7738c4391469132ec54b9ea7505fd29922c2b015
            php: '8.3'
            database: mysqli
            mysql: '8.4'
          - iomad: '5.1.8'
            commit: 7738c4391469132ec54b9ea7505fd29922c2b015
            php: '8.3'
            database: pgsql
            mysql: '8.4'
          - iomad: '5.1.8'
            commit: 7738c4391469132ec54b9ea7505fd29922c2b015
            php: '8.4'
            database: pgsql
            mysql: '8.4'
          - iomad: '5.2.4'
            commit: ef8e8a1e6093518091783b37666d9cb1f4bd8a7d
            php: '8.3'
            database: mysqli
            mysql: '8.4'
          - iomad: '5.2.4'
            commit: ef8e8a1e6093518091783b37666d9cb1f4bd8a7d
            php: '8.3'
            database: pgsql
            mysql: '8.4'
          - iomad: '5.2.4'
            commit: ef8e8a1e6093518091783b37666d9cb1f4bd8a7d
            php: '8.4'
            database: mysqli
            mysql: '8.4'
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      MOODLE_BEHAT_WWWROOT: http://127.0.0.1:8000
      DB_TYPE: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_USER: ${{ matrix.database == 'pgsql' && 'postgres' || 'root' }}
      DB_PASS: ${{ matrix.database == 'pgsql' && 'postgres' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pgsql, gd, intl, soap, zip, mbstring
          coverage: none
          ini-values: max_input_vars=5000
      - name: Prepare pinned tooling and native source
        env:
          DB_PORT: ${{ matrix.database == 'pgsql' && job.services.postgres.ports['5432'] || job.services.mysql.ports['3306'] }}
        run: |
          echo "DB_PORT=$DB_PORT" >> "$GITHUB_ENV"
          composer create-project --no-dev --prefer-dist --no-interaction moodlehq/moodle-plugin-ci ci 4.5.11
          git init iomad-reference
          git -C iomad-reference fetch --depth=1 https://github.com/iomad/iomad.git '${{ matrix.commit }}'
          git -C iomad-reference checkout -b codex/qualified FETCH_HEAD
          sudo locale-gen en_AU.UTF-8
      # This PHP-only plugin uses native CLI setup, not a core/theme asset build.
      # Plugin CI quality commands below run unchanged; native sources stay intact.
      - name: Prepare unmodified native source and PHP dependencies
        run: |
          git clone --no-hardlinks --branch codex/qualified iomad-reference moodle
          echo "MOODLE_DIR=$GITHUB_WORKSPACE/moodle" >> "$GITHUB_ENV"
          composer install --working-dir=moodle --no-interaction --prefer-dist
      - name: Configure isolated native databases
        run: php plugin/.github/scripts/configure_native.php
      - name: Locate the native web root
        shell: bash
        run: |
          if [ -f moodle/public/version.php ]; then
            echo "ICR_WEBROOT=moodle/public" >> "$GITHUB_ENV"
          else
            echo "ICR_WEBROOT=moodle" >> "$GITHUB_ENV"
          fi
      - name: Install ordinary site and documentation checker
        run: |
          cp -R plugin "$ICR_WEBROOT/local/iomadcertregen"
          cp -R ci/vendor/moodlehq/moodle-local_moodlecheck "$ICR_WEBROOT/local/moodlecheck"
          php moodle/admin/cli/install_database.php --agree-license --adminpass="$(php -r 'echo "Aa1!" . bin2hex(random_bytes(20));')" --adminemail=admin@example.invalid --fullname='Certificate CI' --shortname=certificateci
      - name: Initialise PHPUnit only
        run: php "$ICR_WEBROOT/admin/tool/phpunit/cli/init.php" --disable-composer
      - name: Check syntax, style, documentation and upgrade
        run: |
          ci/bin/moodle-plugin-ci phplint plugin
          php -l plugin/.github/scripts/prepare_behat.php
          php -l plugin/.github/scripts/configure_native.php
          ci/bin/moodle-plugin-ci phpcs --max-warnings=0 plugin
          ci/bin/moodle-plugin-ci phpmd plugin | tee phpmd.log
          python3 -c "from pathlib import Path; text=Path('phpmd.log').read_text(); assert 'VIOLATION' not in text and '!!!' not in text"
          ci/bin/moodle-plugin-ci phpdoc --max-warnings=0 --moodle=moodle plugin > phpdoc.log
          cat phpdoc.log
          python3 -c "from pathlib import Path; output=Path('phpdoc.log').read_text(); assert all(str(p.resolve()) in output for p in Path('plugin').rglob('*.php') if '.github' not in p.parts) and '!!!' not in output"
          ci/bin/moodle-plugin-ci validate --moodle=moodle plugin
          ci/bin/moodle-plugin-ci savepoints plugin
      - name: Run plugin PHPUnit suite
        shell: bash
        run: |
          icr_flags=(--fail-on-warning --fail-on-risky --fail-on-incomplete --fail-on-skipped)
          if [ '${{ matrix.iomad }}' != '4.5.15' ]; then
            icr_flags+=(--fail-on-notice --fail-on-deprecation --fail-on-phpunit-deprecation)
          fi
          php moodle/vendor/bin/phpunit --configuration moodle/phpunit.xml --testsuite local_iomadcertregen_testsuite "${icr_flags[@]}"
      - name: Run non-JavaScript acceptance scenarios on current IOMAD
        if: matrix.php == '8.3' && matrix.database == 'pgsql'
        shell: bash
        run: |
          # All three databases are created separately to preserve native OIDC index names.
          php -S 127.0.0.1:8000 -t "$ICR_WEBROOT" > behat-server.log 2>&1 &
          icr_http_pid=$!
          trap 'kill "$icr_http_pid" 2>/dev/null || true' EXIT
          php "$ICR_WEBROOT/admin/tool/behat/cli/util_single_run.php" --install
          php plugin/.github/scripts/prepare_behat.php "$GITHUB_WORKSPACE/$ICR_WEBROOT" > behat-setup.json
          cat behat-setup.json
          icr_behat_config=$(php -r '$data=json_decode(file_get_contents("behat-setup.json"),true,512,JSON_THROW_ON_ERROR); echo $data["config"];')
          php moodle/vendor/bin/behat --config="$icr_behat_config" --suite=default --tags=@local_iomadcertregen --format=progress --strict | tee behat.log
          python3 -c "from pathlib import Path; import re; text=Path('behat.log').read_text(); assert re.search(r'12 scenarios \(12 passed\)', text) and re.search(r'145 steps \(145 passed\)', text)"
